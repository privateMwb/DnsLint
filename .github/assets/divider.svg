    </rect>
    <circle cx="331" cy="28" r="3.6" fill="#37E8A0" filter="url(#glow)">
      <animate attributeName="opacity" values="0.55;1;0.55;0.55" keyTimes="0;0.08;0.22;1" dur="4.4s" begin="0.00s" repeatCount="indefinite"/>
