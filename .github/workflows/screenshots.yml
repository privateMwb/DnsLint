# ============================================================
# .github/workflows/screenshots.yml
# Manually triggered. Opens the frontend in a headless browser, takes
# the README screenshots, uploads them as a downloadable artifact, and
# opens a pull request that updates the screenshots in docs/assets/.
#
# Two ways to run it (the two URL inputs are pre-filled with the live
# deployment, so a plain "Run workflow" captures that):
#
#   - With a frontend URL (and the backend URL it talks to): captures
#     the live deployment. If a backend URL is given it is woken up first,
#     because free Render instances sleep. The script runs a few real checks
#     through the UI (so those runs are added to that backend's check history)
#     and blocks the check request to show the "backend unreachable" state.
#     Nothing is changed or deleted.
#
#   - With the frontend URL cleared: builds the server and the
#     frontend on the runner, runs them there, and captures that. The
#     checks then send real DNS queries from the runner to 8.8.8.8, so
#     it needs outbound UDP (GitHub-hosted runners have it).
#     Works before (or without) a Render/Vercel deployment.
#
# One-time setup for the PR step: Settings -> Actions -> General ->
# "Allow GitHub Actions to create and approve pull requests".
# PRs opened with the built-in token do not start other workflows, so
# the required build checks will not run on it; close and reopen the
# PR (or merge with your bypass) to get them going.
# ============================================================

name: Screenshots

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Frontend URL (clear it to run DnsLint on the runner instead)"
        default: "https://dns-lint.vercel.app"
      backend_url:
        description: "Backend URL (woken up first; ignored if the frontend URL is cleared)"
        default: "https://dnslint.onrender.com"
      open_pr:
        description: "Open a PR that updates the screenshots in docs/assets/"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The live frontend when one is given, otherwise the local preview started below.
      APP_URL: ${{ inputs.app_url != '' && inputs.app_url || 'http://localhost:4173' }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Create the output folder
        run: mkdir -p docs/assets

      - name: Wake the backend (free Render instances sleep)
        if: ${{ inputs.app_url != '' && inputs.backend_url != '' }}
        run: |
          # GET /api/history with no domain answers 400 once the backend is up, on every
          # version of it (older deployments have no /api/health), so 200 or 400 means awake.
          # A sleeping free-tier instance answers 502/503 or hangs while it starts.
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "${{ inputs.backend_url }}/api/history" || echo 000)
            case "$code" in
              200|400) echo "Backend is up (HTTP $code)"; exit 0 ;;
            esac
            echo "Waiting for the backend (HTTP $code, attempt $i of 30)"
            sleep 10
          done
          echo "The backend never woke up"
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # --- Local run: only when no frontend URL was given -------------------------------------

      - name: Build the backend
        if: ${{ inputs.app_url == '' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
          cmake -S backend -B backend/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DDNSLINT_BUILD_TESTS=OFF
          cmake --build backend/build --target dnslint_backend

      - name: Build the frontend
        if: ${{ inputs.app_url == '' }}
        working-directory: frontend
        env:
          VITE_API_BASE_URL: http://localhost:8080
        run: |
          npm ci
          npm run build

      - name: Start the backend and the frontend
        if: ${{ inputs.app_url == '' }}
        run: |
          mkdir -p backend/data
          (cd backend && ./build/dnslint_backend > ../server.log 2>&1 &)
          (cd frontend && npx vite preview --host 127.0.0.1 --port 4173 > ../preview.log 2>&1 &)
          curl --fail --silent --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/api/health
          curl --fail --silent --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:4173/ > /dev/null

      # -----------------------------------------------------------------------------------------

      - name: Install Playwright
        run: |
          mkdir "$RUNNER_TEMP/pw"
          cp scripts/capture-screenshots.mjs "$RUNNER_TEMP/pw/"
          cd "$RUNNER_TEMP/pw"
          npm init -y
          npm install playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Capture screenshots
        working-directory: ${{ runner.temp }}/pw
        env:
          OUT_DIR: ${{ github.workspace }}/docs/assets
        run: node capture-screenshots.mjs

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: |
            docs/assets/*.png
            docs/assets/*.jpg
          if-no-files-found: warn

      - name: Show the backend logs
        if: ${{ failure() && inputs.app_url == '' }}
        run: |
          echo "--- server.log"; cat server.log || true
          echo "--- preview.log"; cat preview.log || true

      - name: Open a PR with the screenshots
        if: ${{ inputs.open_pr }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f docs/assets/_debug-failure.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="docs/screenshots-${{ github.run_id }}"
          git checkout -b "$BRANCH"
          git add docs/assets
          if git diff --cached --quiet; then
            echo "Screenshots are unchanged; no PR needed."
            exit 0
          fi

          git commit -m "docs: update frontend screenshots"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: update frontend screenshots" \
            --body "Screenshots captured by the Screenshots workflow (run ${{ github.run_id }}) from ${APP_URL}. Check the images before merging."
