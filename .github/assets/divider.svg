<svg width="1200" height="56" viewBox="0 0 1200 56" xmlns="http://www.w3.org/2000/svg" role="presentation" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="lead" x1="112" y1="0" x2="304" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#37E8A0" stop-opacity="0"/><stop offset="100%" stop-color="#37E8A0" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="tail" x1="897" y1="0" x2="1108" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF8A3D" stop-opacity="0.7"/><stop offset="100%" stop-color="#FF8A3D" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="prompt" x1="40" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#37E8A0"/><stop offset="100%" stop-color="#8FE0B8"/>
    </linearGradient>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- The command, as typed -->
  <text x="40" y="32" font-family="'SF Mono','Cascadia Code',Consolas,'Courier New',monospace" font-size="12" font-weight="700" fill="url(#prompt)">$ dnslint</text>
  <rect x="104" y="22" width="7" height="13" rx="1.5" fill="#37E8A0">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Leader lines into and out of the results -->
  <line x1="122" y1="28" x2="304" y2="28" stroke="url(#lead)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="897" y1="28" x2="1108" y2="28" stroke="url(#tail)" stroke-width="1.5" stroke-linecap="round"/>

