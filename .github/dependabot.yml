# ============================================================
# .github/dependabot.yml
#
# - github-actions: keeps workflow action versions current.
# - npm: keeps frontend/package.json dependencies current.
# - docker: keeps the ubuntu base images in Dockerfile current.
# - docker (/.clusterfuzzlite): keeps the pinned OSS-Fuzz base image
#   digest in .clusterfuzzlite/Dockerfile current.
#
# - gitsubmodule: keeps FalconHTTP, DnsResolver, MiniDatabase and RateThrottle
#   (git submodules under backend/external/) current. Updates to
#   the four arrive as one grouped PR. Their own nested submodules
#   are pinned by each of them and move when they do.
# ============================================================

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    # Sub-actions of one repo are separate dependencies to Dependabot, so each pair gets a group
    # that moves it together in ONE PR, for every kind of update (major included). Otherwise one
    # PR bumps build_fuzzers and leaves run_fuzzers on the old version, or the reverse.
    # Everything else is grouped for minor and patch bumps only: a major bump gets its own PR, so
    # it can fail or be postponed without holding back the rest. (A dependency joins the first
    # group that matches it, which is why the specific groups come first.)
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
      clusterfuzzlite:
        patterns:
          - "google/clusterfuzzlite/*"
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "npm"
    ignore:
      # typescript-eslint 8.x only supports TypeScript below 6.1, so a TypeScript 6.1 or 7 bump
      # makes `npm ci` fail with ERESOLVE, and because everything npm moves is one grouped PR,
      # it takes the whole group down with it (Frontend build and Vercel deploy included).
      # Patch releases still flow. Remove this once typescript-eslint lists the newer TypeScript
      # as a supported peer.
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
    # Everything npm moves in ONE PR, majors included. These packages can't be bumped one at a
    # time: react-dom needs the matching react, and @vitejs/plugin-react needs the matching
    # vite, so separate PRs each fail CI on their own.
    groups:
      npm:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/.clusterfuzzlite"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "docker"
    groups:
      docker:
        patterns:
          - "*"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    # One PR for every submodule that moved, instead of one per library.
    groups:
      submodules:
        patterns:
          - "*"
